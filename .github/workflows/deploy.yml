name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (not `npm ci`): the lock file omits some cross-platform
      # optional deps (@tailwindcss/oxide wasm → @emnapi/*) that npm on macOS
      # doesn't record, which npm ci's strict integrity check rejects on Linux.
      - run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
        env:
          # Repo subpath so assets/links resolve under museloper.github.io/pochams-helper
          NEXT_PUBLIC_BASE_PATH: /pochams-helper
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
